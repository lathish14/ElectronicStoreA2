<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>List of Customers</title>
        <h:outputStylesheet library="css" name="style.css"/>
    </h:head>

    <h:body>
        <div class="header">
            <h1>List of Customers</h1>
        </div>

        <div class="content">
            <h:outputText value="#{customerBean.message}"
                          styleClass="success-msg"
                          rendered="#{not empty customerBean.message}"/>

            <h:dataTable value="#{customerBean.customers}"
                         var="c"
                         styleClass="data-table"
                         headerClass="table-header"
                         rendered="#{not empty customerBean.customers}">

                <h:column>
                    <f:facet name="header">Name</f:facet>
                        #{c.fullName}
                </h:column>

                <h:column>
                    <f:facet name="header">Address</f:facet>
                        #{c.address}
                </h:column>

                <h:column>
                    <f:facet name="header">Orders</f:facet>
                        #{customerBean.getOrderCount(c)}
                </h:column>

                <h:column>
                    <f:facet name="header">Action</f:facet>
                    <h:link value="View Details" outcome="/customerDetail.xhtml">
                        <f:param name="customerId" value="#{c.customerId}"/>
                    </h:link>
                </h:column>

            </h:dataTable>

            <h:outputText value="No customers found."
                          rendered="#{empty customerBean.customers}"/>

            <br/>

            <p>Total customers: #{customerBean.customers.size()}</p>

            <h:link value="Create a New Customer" outcome="/newCustomer.xhtml"/>
            <span> | </span>
            <h:link value="Main Page" outcome="/default.xhtml"/>
        </div>
    </h:body>
</html>
