<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Login</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
    <div class="header">
        <h1>Login Your Account</h1>
    </div>
    <div class="content">
        <h:messages globalOnly="true" styleClass="error-msg" showDetail="true"/>
        <h:form>
            <h:panelGrid columns="2" styleClass="form-grid">
                <h:outputLabel value="Username" for="username"/>
                <h:inputText id="username" value="#{loginBean.username}" required="true"
                             requiredMessage="Username is required."/>

                <h:outputLabel value="Password" for="password"/>
                <h:inputSecret id="password" value="#{loginBean.password}" required="true"
                               requiredMessage="Password is required."/>
            </h:panelGrid>
            <h:commandButton value="Login" action="#{loginBean.login}" styleClass="btn"/>
            <br/>
            <h:link value="Forget your user name and/or password" outcome="/emailRecovery.xhtml"/>
        </h:form>
        <br/>
        <h:link value="Create a New Account" outcome="/email.xhtml"/>
        <span> | </span>
        <h:link value="Welcome Page" outcome="/index.xhtml"/>
    </div>
</h:body>
</html>
