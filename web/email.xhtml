<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Email Verification</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
    <div class="header">
        <h1>Verify Your Email</h1>
    </div>
    <div class="content">
        <h:messages globalOnly="true" styleClass="error-msg" showDetail="true"/>
        <h:form>
            <h:panelGrid columns="2" styleClass="form-grid">
                <h:outputLabel value="Email Address" for="email"/>
                <h:inputText id="email" value="#{emailVerificationBean.email}" required="true"
                             requiredMessage="Email address is required."
                             validatorMessage="Please enter a valid email address.">
                    <f:validateRegex pattern="^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$"/>
                </h:inputText>
            </h:panelGrid>
            <h:commandButton value="Create Verification Code"
                             action="#{emailVerificationBean.sendVerificationCode}"
                             styleClass="btn"/>
        </h:form>
        <br/>
        <h:link value="Welcome Page" outcome="/index.xhtml"/>
    </div>
</h:body>
</html>
