<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Search for a Customer</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
    <div class="header">
        <h1>Search for a Customer</h1>
    </div>
    <div class="content">
        <h:messages globalOnly="true" styleClass="error-msg" showDetail="true"/>
        <h:form>
            <h:panelGrid columns="2" styleClass="form-grid">
                <h:outputLabel value="Name:" for="name"/>
                <h:inputText id="name" value="#{customerBean.searchName}"/>
            </h:panelGrid>
            <h:commandButton value="Search for a customer" action="#{customerBean.searchCustomers}" styleClass="btn"/>
        </h:form>
        <br/>
        <h:dataTable value="#{customerBean.foundCustomers}" var="c"
                     styleClass="data-table" headerClass="table-header"
                     rendered="#{not empty customerBean.foundCustomers}">
            <h:column><f:facet name="header">Name</f:facet>#{c.fullName}</h:column>
            <h:column><f:facet name="header">Address</f:facet>#{c.address}</h:column>
            <h:column>
                <f:facet name="header">Orders</f:facet>#{c.orders.size()}
            </h:column>
            <h:column>
                <f:facet name="header">Action</f:facet>
                <h:link value="View Details" outcome="/customerDetail.xhtml">
                    <f:param name="customerId" value="#{c.customerId}"/>
                </h:link>
            </h:column>
        </h:dataTable>
        <h:outputText value="No customers found matching your search."
                      rendered="#{customerBean.foundCustomers != null and empty customerBean.foundCustomers}"/>
        <h:outputText value="Total customers: #{customerBean.foundCustomers.size()}"
                      rendered="#{not empty customerBean.foundCustomers}"/>
        <br/><br/>
        <h:link value="Customer List" outcome="/listCustomers.xhtml"/>
        <span> | </span>
        <h:link value="Main Page" outcome="/default.xhtml"/>
    </div>
</h:body>
</html>
