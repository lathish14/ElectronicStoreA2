<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>List of Orders</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
    <div class="header">
        <h1>List of Orders</h1>
    </div>
    <div class="content">
        <h:outputText value="#{orderBean.message}" styleClass="success-msg"
                      rendered="#{not empty orderBean.message}"/>
        <h:messages globalOnly="true" styleClass="error-msg" showDetail="true"/>
        <h:dataTable value="#{orderBean.orders}" var="o"
                     styleClass="data-table" headerClass="table-header"
                     rendered="#{not empty orderBean.orders}">
            <h:column>
                <f:facet name="header">Order #</f:facet>
                #{o.orderId}
            </h:column>
            <h:column>
                <f:facet name="header">Customer</f:facet>
                #{o.customer.fullName}
            </h:column>
            <h:column>
                <f:facet name="header">Device</f:facet>
                #{o.product.brand} - #{o.product.model}
            </h:column>
            <h:column>
                <f:facet name="header">Action</f:facet>
                <h:form>
                    <h:commandLink value="Delete" action="#{orderBean.deleteOrder(o.orderId)}"
                                   styleClass="delete-link"
                                   onclick="return confirm('Are you sure you want to delete this order?');"/>
                </h:form>
            </h:column>
        </h:dataTable>
        <h:outputText value="No orders found." rendered="#{empty orderBean.orders}"/>
        <br/>
        <p>Total orders: #{orderBean.orders.size()}</p>
        <h:link value="Create a new Order" outcome="/newOrder.xhtml"/>
        <span> | </span>
        <h:link value="Main Page" outcome="/default.xhtml"/>
    </div>
</h:body>
</html>
