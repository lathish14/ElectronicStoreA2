<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Create a new Customer</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
    <div class="header">
        <h1>Create a new Customer</h1>
    </div>
    <div class="content">
        <h:messages globalOnly="true" styleClass="error-msg" showDetail="true"/>
        <h:form>
            <h:panelGrid columns="2" styleClass="form-grid">
                <h:outputLabel value="First Name:" for="fname"/>
                <h:inputText id="fname" value="#{customerBean.firstName}" required="true"
                             requiredMessage="First name is required."/>

                <h:outputLabel value="Last Name:" for="lname"/>
                <h:inputText id="lname" value="#{customerBean.lastName}" required="true"
                             requiredMessage="Last name is required."/>

                <h:outputLabel value="Address:" for="addr"/>
                <h:inputText id="addr" value="#{customerBean.address}" required="true"
                             requiredMessage="Address is required."/>

                <h:outputLabel value="Phone Number:" for="phone"/>
                <h:inputText id="phone" value="#{customerBean.phone}"/>

                <h:outputLabel value="Email Address:" for="email"/>
                <h:inputText id="email" value="#{customerBean.email}" required="true"
                             requiredMessage="Email address is required."/>
            </h:panelGrid>
            <h:commandButton value="Create a customer" action="#{customerBean.createCustomer}" styleClass="btn"/>
        </h:form>
        <br/>
        <h:link value="Customer List" outcome="/listCustomers.xhtml"/>
        <span> | </span>
        <h:link value="Main Page" outcome="/default.xhtml"/>
    </div>
</h:body>
</html>
