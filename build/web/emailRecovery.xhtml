<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Email Recovery</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
    <div class="header">
        <h1>Recovery from Your Email</h1>
    </div>
    <div class="content">
        <h:messages globalOnly="true" styleClass="error-msg" showDetail="true"/>
        <h:form>
            <h:panelGrid columns="2" styleClass="form-grid">
                <h:outputLabel value="Email Address" for="email"/>
                <h:inputText id="email" value="#{recoveryBean.email}" required="true"
                             requiredMessage="Email address is required."/>
            </h:panelGrid>
            <h:commandButton value="Create Recovery Code"
                             action="#{recoveryBean.sendRecoveryCode}"
                             styleClass="btn"/>
        </h:form>
        <br/>
        <h:link value="Welcome Page" outcome="/index.xhtml"/>
    </div>
</h:body>
</html>
