<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">

    <h:head>
        <title>Recovery</title>
        <h:outputStylesheet library="css" name="style.css"/>
    </h:head>

    <h:body>
        <div class="header">
            <h1>Recover Your Account</h1>
        </div>

        <div class="content">
            <h:messages globalOnly="true"
                        styleClass="error-msg"
                        showDetail="true"/>

            <p>
                Retrieve the recovery code from
                <b>#{recoveryBean.email}</b> and enter below!
            </p>

            <h:form>

                <div class="recovery-form-grid">

                    <div class="form-label">
                        <h:outputLabel value="Recovery Code" for="rcode"/>
                    </div>
                    <div class="form-input">
                        <h:inputText id="rcode"
                                     value="#{recoveryBean.recoveryCode}"
                                     required="true"
                                     requiredMessage="Recovery code is required."/>
                    </div>

                    <div class="form-label">
                        <h:outputText value="First Name"/>
                    </div>
                    <div class="form-input">
                        <h:outputText value="#{recoveryBean.foundAccount.firstName}"/>
                    </div>

                    <div class="form-label">
                        <h:outputText value="Last Name"/>
                    </div>
                    <div class="form-input">
                        <h:outputText value="#{recoveryBean.foundAccount.lastName}"/>
                    </div>

                    <div class="form-label">
                        <h:outputText value="Username"/>
                    </div>
                    <div class="form-input">
                        <h:outputText value="#{recoveryBean.foundAccount.username}"/>
                    </div>

                    <div class="form-label">
                        <h:outputLabel value="New Password" for="npwd"/>
                    </div>
                    <div class="form-input">
                        <h:inputSecret id="npwd"
                                       value="#{recoveryBean.newPassword}"
                                       required="true"
                                       requiredMessage="New password is required."/>
                    </div>

                    <div class="form-label">
                        <h:outputLabel value="New Password (verify)" for="npwd2"/>
                    </div>
                    <div class="form-input">
                        <h:inputSecret id="npwd2"
                                       value="#{recoveryBean.newPasswordVerify}"
                                       required="true"
                                       requiredMessage="Please verify your new password."/>
                    </div>

                </div>

                <h:commandButton value="Recover"
                                 action="#{recoveryBean.resetPassword}"
                                 styleClass="btn"/>

            </h:form>

            <br/>
            <h:link value="Welcome Page" outcome="/index.xhtml"/>
        </div>
    </h:body>
</html>
