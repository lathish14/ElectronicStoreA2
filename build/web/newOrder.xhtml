<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Create a new Order</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
    <div class="header">
        <h1>Create a new Order</h1>
    </div>
    <div class="content">
        <h:messages globalOnly="true" styleClass="error-msg" showDetail="true"/>
        <h:form>
            <h:panelGrid columns="2" styleClass="form-grid">
                <h:outputLabel value="Customer:" for="cust"/>
                <h:selectOneMenu id="cust" value="#{orderBean.selectedCustomerId}" required="true"
                                 requiredMessage="Please select a customer.">
                    <f:selectItem itemLabel="-- Select Customer --" itemValue="#{null}" noSelectionOption="true"/>
                    <f:selectItems value="#{orderBean.customerItems}"/>
                </h:selectOneMenu>

                <h:outputLabel value="Device:" for="prod"/>
                <h:selectOneMenu id="prod" value="#{orderBean.selectedProductId}" required="true"
                                 requiredMessage="Please select a product.">
                    <f:selectItem itemLabel="-- Select Product --" itemValue="#{null}" noSelectionOption="true"/>
                    <f:selectItems value="#{orderBean.productItems}"/>
                </h:selectOneMenu>

                <h:outputLabel value="Quantity:" for="qty"/>
                <h:inputText id="qty" value="#{orderBean.quantity}" required="true"
                             requiredMessage="Quantity is required.">
                    <f:convertNumber integerOnly="true"/>
                </h:inputText>
            </h:panelGrid>
            <h:commandButton value="Create an order" action="#{orderBean.createOrder}" styleClass="btn"/>
        </h:form>
        <br/>
        <h:link value="Order List" outcome="/listOrders.xhtml"/>
        <span> | </span>
        <h:link value="Main Page" outcome="/default.xhtml"/>
    </div>
</h:body>
</html>
